spring.application.name=transaction-service
server.port=${SERVER_PORT:8088}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/demo_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
logging.structured.format.file=ecs

logging.file.name=./transaction/logs/application.log
logging.level.root = ${LOG_LEVEL:info}
spring.web.error.include-message=${SPRING_ERROR_INCLUDE_MESSAGE:always}
spring.web.error.include-stacktrace=${SPRING_ERROR_INCLUDE_STACKTRACE:always}
spring.web.error.include-binding-errors=${SPRING_ERROR_INCLUDE_BINDING_ERRORS:always}


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}



spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8010}
spring.kafka.listener.observation-enabled=${KAFKA_LISTENER_OBSERVATION_ENABLED:true}
spring.kafka.template.observation-enabled=${KAFKA_TEMPLATE_OBSERVATION_ENABLED:true}

spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all

spring.kafka.consumer.group-id=transaction-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.specific.avro.reader=true


management.opentelemetry.tracing.export.otlp.enabled=${OTLP_ENABLED:true}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=${OTLP_TRANSPORT:http}
