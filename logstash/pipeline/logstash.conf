input {
    beats {
        port => 5044
    }
}

filter {
    json {
        source => "message"
        tag_on_failure => ["_jsonparsefailure"]
    }

}

output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "application-logs-%{+YYYY.MM.dd}"
    }

    stdout {
        codec => rubydebug
    }
}