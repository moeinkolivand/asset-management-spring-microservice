spring.application.name=${APP_NAME:user-service}
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/demo_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

logging.level.root = ${LOG_LEVEL:debug}
spring.web.error.include-message=${SPRING_ERROR_INCLUDE_MESSAGE:always}
spring.web.error.include-stacktrace=${SPRING_ERROR_INCLUDE_STACKTRACE:always}
spring.web.error.include-binding-errors=${SPRING_ERROR_INCLUDE_BINDING_ERRORS:always}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:604800000}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8010}

management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.tracing.export.enabled=${TRACING_EXPORT_ENABLED:true}

management.opentelemetry.tracing.export.otlp.enabled=${OTLP_ENABLED:true}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=${OTLP_TRANSPORT:http}

spring.kafka.listener.observation-enabled=${KAFKA_LISTENER_OBSERVATION_ENABLED:true}
spring.kafka.template.observation-enabled=${KAFKA_TEMPLATE_OBSERVATION_ENABLED:true}

app.seed.admin.phone-number=${APP_SEED_ADMIN_PHONE_NUMBER:}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:}